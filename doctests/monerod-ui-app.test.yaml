name: monerod_ui — start a stagenet node, watch it sync, stop it
project_name: logos-monerod-ui

# Builds are flake URLs, not `path:..`: each step runs in a throwaway directory.
# This run needs outbound P2P to stagenet peers; finding the first one has taken 90-230 s.

intro: |
  The node runs inside monerod_module's own host process, so the app never spawns a daemon.
  This run starts a fresh stagenet node from the UI, waits until a peer announces the chain height
  and blocks start arriving, then stops it again.

sections:
  - title: "Build the app and the module tree"
    steps:
      # Basecamp's standalone mode, the app's real host: its design system is the one users get.
      - title: "Build Basecamp's standalone host, the node module and the UI"
        run: |
          set -eu
          nix build 'github:logos-co/logos-basecamp#app-standalone' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
          nix build 'github:logos-co/logos-monerod-module{release}#install' --no-write-lock-file -o result-monerod
          nix build 'github:logos-co/logos-monerod-ui{release}#install' --no-write-lock-file -o result-ui
          mkdir -p tree/modules
          cp -rL result-monerod/modules/* tree/modules/
          chmod -R u+w tree
          ls tree/modules result-ui/plugins
        code_block: |
          nix build 'github:logos-co/logos-basecamp#app-standalone' -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' -o result-mcp
          nix build 'github:logos-co/logos-monerod-module#install' -o result-monerod
          nix build 'github:logos-co/logos-monerod-ui#install' -o result-ui
          mkdir -p tree/modules
          cp -rL result-monerod/modules/* tree/modules/
          chmod -R u+w tree
        expect_contains: ["monerod_module", "monerod_ui"]

  - title: "Drive the node"
    steps:
      - title: "Start a stagenet node, wait for it to sync, stop it"
        ui_test:
          # LOGOS_NO_SCHEME_REGISTER: a test run leaves the machine's logos:// handler alone.
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 LOGOS_NO_SCHEME_REGISTER=1 ./result-basecamp/bin/LogosBasecamp --module ./result-ui --modules-dir ./tree/modules --user-dir ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "The node starts stopped"
              # "stopped" too: the badge reads "checking" until the first status() answers.
              action: wait_for
              texts: ["Monero node", "Not running", "stopped"]
              timeout: 30000
              screenshot: "monerod-ui-stopped.png"
            - name: "The badge says so"
              action: expect_property
              find_by: "objectName"
              find_value: "stateBadge"
              property: "text"
              value: "stopped"
            - name: "Stagenet is the default network"
              action: expect_property
              find_by: "objectName"
              find_value: "networkCombo"
              property: "currentText"
              value: "stagenet"
            - name: "Start"
              action: click
              target: "Start"
            - name: "The node is running"
              action: wait_for
              texts: ["running"]
              timeout: 60000
            - name: "A peer announces the chain height and the node syncs"
              # "Syncing" appears only once a peer's height exceeds ours; before that it says
              # "Waiting for peers" and the bar stays empty.
              action: wait_for
              texts: ["Syncing"]
              timeout: 900000
              screenshot: "monerod-ui-syncing.png"
            - name: "The percentage shows beside it"
              action: expect_property
              find_by: "objectName"
              find_value: "syncPercent"
              property: "visible"
              value: true
            - name: "Stop"
              action: click
              target: "Stop"
            - name: "The node stops"
              # The card reads "Stopping…" while the node winds down, which takes a few seconds.
              action: wait_for
              texts: ["Not running", "stopped"]
              timeout: 90000
              screenshot: "monerod-ui-stopped-again.png"
            - name: "The badge is back to stopped"
              action: expect_property
              find_by: "objectName"
              find_value: "stateBadge"
              property: "text"
              value: "stopped"
            - name: "Start is enabled again"
              action: expect_property
              find_by: "objectName"
              find_value: "startButton"
              property: "enabled"
              value: true
