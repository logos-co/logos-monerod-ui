name: CI

# `nix build` proves nothing about QML: one bad import or mistyped Theme token takes the view
# down at runtime and says so only through a warning. So the view is linted AND constructed here;
# the end-to-end drive lives in doctests.yml. The design system is static-linked into the host,
# but its SOURCE decides which imports and Theme tokens exist, so it is checked out beside us.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment; main jobs must opt into
    # it to publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build plugin and package
        run: nix build -L .#lgx

  qml:
    name: qmllint + construct
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: logos-monerod-ui

      - uses: actions/checkout@v4
        with:
          repository: logos-co/logos-design-system
          path: logos-design-system

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Static (imports, types, property names)
        working-directory: logos-monerod-ui
        # `-W 0` fails on the first warning. `--unqualified` is off: `logos` is host-injected.
        run: |
          # shellcheck disable=SC2016  # the $(...) is for the inner bash -c, by design
          nix shell nixpkgs#qt6.qtdeclarative -c bash -c '
            QTQML=$(dirname $(dirname $(readlink -f $(command -v qmllint))))/lib/qt-6/qml
            qmllint -I "$QTQML" -I ../logos-design-system/src/qml \
                    -W 0 --unqualified disable src/qml/Main.qml'

      - name: Construct the view for real
        working-directory: logos-monerod-ui
        run: |
          # shellcheck disable=SC2016  # the $(...) is for the inner bash -c, by design
          nix shell nixpkgs#qt6.qtdeclarative nixpkgs#qt6.qtsvg -c bash -c '
            d=$(dirname $(dirname $(readlink -f $(command -v qml))))
            # Basic: under a platform style the design system'"'"'s contentItem overrides are
            # refused. QT_LOGGING_TO_CONSOLE: otherwise Qt logs to journald on a runner.
            QT_LOGGING_TO_CONSOLE=1 QT_QUICK_CONTROLS_STYLE=Basic QT_QPA_PLATFORM=offscreen \
              timeout 60 qml -I "$d/lib/qt-6/qml" -I ../logos-design-system/src/qml \
              ci/construct.qml > /tmp/qml.log 2>&1
            status=$?
            cat /tmp/qml.log
            # 124 IS THE PASS: the event loop was still running when timeout ended it.
            [ $status -eq 124 ] || { echo "::error::qml exited $status (expected 124)"; exit 1; }
            # A positive line, so an empty log (messages sent elsewhere) cannot pass.
            grep -q "VIEW-READY" /tmp/qml.log || { echo "::error::the view never reported ready"; exit 1; }
            if grep -qE "VIEW-ERROR|does not support customization|Cannot assign|was not found|ReferenceError" /tmp/qml.log; then
              echo "::error::QML errors above"; exit 1
            fi'
